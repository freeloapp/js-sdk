stages:
  - generate
  - build
  - test

default:
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

generate:
  stage: generate
  script:
    - npm ci
    - npm run generate:check
  rules:
    - changes:
        - openapi-ts.config.ts
        - src/generated/**/*
    - if: $CI_PIPELINE_SOURCE == "schedule"

build:
  stage: build
  script:
    - npm ci
    - npm run build
    - npm run typecheck

test:
  stage: test
  script:
    - npm ci
    - npm run lint
    - npm run test:run
